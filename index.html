<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a5f">
<title>Tableau de bord Satisfaction — Lycée Maritime Boulogne</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">

  <header class="header">
    <img class="logo" width="116" height="116" decoding="async" alt="Lycée Maritime Boulogne"
         onerror="this.style.display='none'"
         src="https://www.lyceemaritime-boulogne.com/application/themes/theme_simpleo_coteo/images/logo-lycee-maritime-boulogne.jpg">
    <div class="text">
      <h1 id="page-title">📊 Tableau de bord Satisfaction FI</h1>
      <div class="meta">
        <span>Lycée Professionnel Maritime Boulogne — Le Portel</span>
        <span class="updated" id="updated"><i></i><span>MAJ <span id="updated-date"></span></span></span>
      </div>
    </div>
  </header>

  <div class="box toolbar">
    <label for="anneeScolaire">Année</label>
    <select id="anneeScolaire"></select>

    <label for="dateDebut">Du</label>
    <input type="date" id="dateDebut">
    
    <label for="dateFin">Au</label>
    <input type="date" id="dateFin">
    
    <button id="btnVerbatims" class="btn" type="button" hidden>
      ⬇ Verbatims (<span id="verbCount">0</span>)
    </button>
    
    <button id="btnPrint" class="btn" type="button" title="Imprimer en PDF">🖨</button>
  </div>

  <div class="message" id="message"></div>

  <!-- ============ VUE ACCUEIL : 4 CARTES ============ -->
  <div id="home-view">
    <div class="loading" id="loading-home">
      <div class="spin"></div><div>Chargement des enquêtes…</div>
    </div>
    <div class="cards-grid" id="cards-grid"></div>
  </div>

  <!-- ============ VUE DÉTAIL ============ -->
  <div id="detail-view" hidden>
    <div id="detail-content"></div>
  </div>

  <footer>
    <p>Conception et réalisation : <b>ZEG</b> — Lycée Maritime Boulogne, <span id="year"></span></p>
    <p class="mention">Projet réalisé dans le cadre du pacte enseignant</p>
  </footer>

</div>
<script src="js/app.js"></script>
</body>
</html>
